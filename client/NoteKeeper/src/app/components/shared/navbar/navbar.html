<nav class="w-full border-b border-border bg-background-secondary">
  <div class="mx-auto flex h-18 max-w-7xl items-center justify-between gap-6 px-4 md:px-8">
    <!-- Logo -->
    <a routerLink="/" class="flex shrink-0 items-center gap-3 text-text-primary no-underline">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-muted">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-primary"
        >
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M8 8h8M8 12h8M8 16h5" />
        </svg>
      </div>

      <span class="font-heading text-xl font-extrabold tracking-tight">
        Note<span class="text-primary">ly.</span>
      </span>
    </a>

    <!-- Navigation Links -->
    <div class="hidden items-center gap-2 md:flex">
      <a
        href="#"
        class="rounded-button bg-surface-active px-4 py-2 text-sm font-semibold text-primary transition-colors"
      >
        My Notes
      </a>

      <a
        href="#"
        class="rounded-button px-4 py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-surface-hover hover:text-text-primary"
      >
        Reminders
      </a>

      <a
        href="#"
        class="rounded-button px-4 py-2 text-sm font-medium text-text-secondary transition-colors hover:bg-surface-hover hover:text-text-primary"
      >
        Categories
      </a>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-3">
      <!-- Search -->

      @if (provideUser.isLoggedIn) {
        <!-- Create Note -->
        <button
          type="button"
          class="flex cursor-pointer items-center gap-2 rounded-button bg-primary px-4 py-2.5 text-sm font-bold text-text-inverse transition-all hover:bg-primary-hover hover:shadow-primary"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>

          <span class="hidden sm:inline">New Note</span>
        </button>

        <!-- User Avatar -->
        <button
          type="button"
          aria-label="User profile"
          class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full border border-primary/30 bg-primary-muted font-heading text-sm font-bold text-primary-light transition-colors hover:border-primary"
        >
          TK
        </button>
      } @else {
        <a
          routerLink="/login"
          type="button"
          class="flex cursor-pointer items-center gap-2 rounded-button bg-primary px-4 py-2.5 text-sm font-bold text-text-inverse transition-all hover:bg-primary-hover hover:shadow-primary"
        >
          <i class="bi bi-person"></i>

          <span class="hidden sm:inline">Login</span>
        </a>
      }
    </div>
  </div>

  <!-- Mobile Navigation -->
  <div class="flex items-center justify-center gap-2 border-t border-border px-4 py-2 md:hidden">
    <a
      href="#"
      class="rounded-button bg-surface-active px-4 py-2 text-xs font-semibold text-primary"
    >
      My Notes
    </a>

    <a
      href="#"
      class="rounded-button px-4 py-2 text-xs font-medium text-text-secondary hover:text-primary"
    >
      Reminders
    </a>

    <a
      href="#"
      class="rounded-button px-4 py-2 text-xs font-medium text-text-secondary hover:text-primary"
    >
      Categories
    </a>
  </div>
</nav>

<section class="flex min-h-[calc(100vh-72px)] items-center justify-center bg-background px-4 py-12">
  <div class="w-full max-w-md rounded-card border border-border bg-surface p-8 shadow-card sm:p-10">
    <!-- Header -->
    <div class="mb-8 text-center">
      <!-- Icon -->
      <div
        class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary-muted"
      >
        <i
          class="bi bi-journal-text inline-flex h-[28px] w-[28px] shrink-0 items-center justify-center text-[28px] leading-none text-primary"
          aria-hidden="true"
        ></i>
      </div>

      <h1 class="font-heading text-3xl font-extrabold text-text-primary">
        Create your account<span class="text-primary">.</span>
      </h1>

      <p class="mt-3 font-body text-sm text-text-secondary">
        Join Notely and keep your notes and reminders organized.
      </p>
    </div>

    @if (errorMessage(); as message) {
      <!-- Error Message -->
      <div
        role="alert"
        class="flex mb-3 items-center gap-3 rounded-input border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger transition-all duration-200"
      >
        <!-- Error Icon -->
        <i
          class="bi bi-exclamation-triangle inline-flex h-[20px] w-[20px] shrink-0 items-center justify-center text-[20px] leading-none"
          aria-hidden="true"
        ></i>

        <!-- Error Text -->
        <span class="font-body font-medium leading-relaxed">
          {{ message }}
        </span>
      </div>
    }

    <!-- Register Form -->
    <form class="flex flex-col gap-6" (submit)="sendCreateUser($event)">
      <!-- Grid de Inputs -->
      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <!-- Username -->
        <div class="flex flex-col gap-2">
          <label for="username" class="font-heading text-sm font-semibold text-text-primary">
            Username
          </label>

          <input
            id="username"
            type="text"
            placeholder="Enter your username"
            autocomplete="username"
            [formField]="createUserModel.nome"
            class="w-full rounded-input border border-border bg-background-tertiary px-4 py-3 font-body text-sm text-text-primary outline-none transition-all duration-200 placeholder:text-text-muted hover:border-border-hover focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-2">
          <label for="email" class="font-heading text-sm font-semibold text-text-primary">
            Email address
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            [formField]="createUserModel.email"
            class="w-full rounded-input border border-border bg-background-tertiary px-4 py-3 font-body text-sm text-text-primary outline-none transition-all duration-200 placeholder:text-text-muted hover:border-border-hover focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-2">
          <label for="password" class="font-heading text-sm font-semibold text-text-primary">
            Password
          </label>

          <input
            id="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            [formField]="createUserModel.senha"
            class="w-full rounded-input border border-border bg-background-tertiary px-4 py-3 font-body text-sm text-text-primary outline-none transition-all duration-200 placeholder:text-text-muted hover:border-border-hover focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>

        <!-- Confirm Password -->
        <div class="flex flex-col gap-2">
          <label for="confirmPassword" class="font-heading text-sm font-semibold text-text-primary">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            [formField]="createUserModel.confirmSenha"
            class="w-full rounded-input border border-border bg-background-tertiary px-4 py-3 font-body text-sm text-text-primary outline-none transition-all duration-200 placeholder:text-text-muted hover:border-border-hover focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-button bg-primary px-5 py-3 font-heading text-sm font-bold text-text-inverse shadow-primary transition-all duration-200 hover:bg-primary-hover hover:shadow-card-hover active:bg-primary-active"
      >
        Create Account

        <i
          class="bi bi-arrow-right inline-flex h-[17px] w-[17px] shrink-0 items-center justify-center text-[17px] leading-none"
          aria-hidden="true"
        ></i>
      </button>
    </form>

    <!-- Divider -->
    <div class="my-7 flex items-center gap-4">
      <div class="h-px flex-1 bg-border"></div>

      <span class="text-xs text-text-muted"> Already have an account? </span>

      <div class="h-px flex-1 bg-border"></div>
    </div>

    <!-- Login -->
    <a
      routerLink="/loginPage"
      class="flex w-full items-center justify-center rounded-button border border-border bg-background-secondary px-5 py-3 font-heading text-sm font-semibold text-text-primary transition-all duration-200 hover:border-primary hover:bg-primary-muted hover:text-primary-light"
    >
      Sign In
    </a>

    <!-- Footer -->
    <p class="mt-8 text-center text-xs text-text-muted">Your thoughts, organized in one place.</p>
  </div>
</section>

<nav class="w-full border-b border-border bg-background-secondary">
  <div class="mx-auto flex h-18 max-w-7xl items-center justify-between gap-6 px-4 md:px-8">
    <!-- Logo -->
    <a routerLink="/" class="flex shrink-0 items-center gap-3 text-text-primary no-underline">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-muted">
        <i
          class="bi bi-journal-text inline-flex h-[23px] w-[23px] shrink-0 items-center justify-center text-[23px] leading-none text-primary"
          aria-hidden="true"
        ></i>
      </div>

      <span class="font-heading text-xl font-extrabold tracking-tight">
        Note<span class="text-primary">ly.</span>
      </span>
    </a>

    <!-- Navigation Links -->
    <div class="hidden items-center gap-2 md:flex">
      <a
        routerLink="/notes"
        routerLinkActive="bg-surface-active text-primary"
        #notesActive="routerLinkActive"
        [class.text-text-secondary]="!notesActive.isActive"
        ariaCurrentWhenActive="page"
        class="rounded-button px-4 py-2 text-sm font-semibold transition-colors"
      >
        My Notes
      </a>
      <a
        routerLink="/categories"
        routerLinkActive="bg-surface-active text-primary"
        #categoriesActive="routerLinkActive"
        [class.text-text-secondary]="!categoriesActive.isActive"
        ariaCurrentWhenActive="page"
        class="rounded-button px-4 py-2 text-sm font-medium transition-colors"
      >
        Categories
      </a>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-3">
      <!-- Search -->

      @if (provideUser.isLoggedIn()) {
        <!-- User Dropdown -->
        <div class="relative" (keydown.escape)="dropdownOpen.set(false)">
          <!-- Dropdown Trigger -->
          <button
            type="button"
            (click)="dropdownOpen.set(!dropdownOpen())"
            [attr.aria-expanded]="dropdownOpen()"
            aria-haspopup="true"
            class="flex cursor-pointer items-center gap-3 rounded-button border border-border bg-surface px-4 py-2.5 text-sm font-semibold text-text-primary transition-all duration-200 hover:border-border-hover hover:bg-surface-hover"
          >
            <!-- User Icon -->
            <div
              class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-muted text-primary"
            >
              <i
                class="bi bi-person inline-flex h-[19px] w-[19px] shrink-0 items-center justify-center text-[19px] leading-none"
                aria-hidden="true"
              ></i>
            </div>

            <!-- Username -->
            <span class="hidden max-w-32 truncate sm:block">
              {{ provideUser.username() }}
            </span>

            <!-- Chevron -->
            <i
              class="bi bi-chevron-down inline-flex h-[16px] w-[16px] shrink-0 items-center justify-center text-[16px] leading-none text-text-muted transition-transform duration-200"
              aria-hidden="true"
              [class.rotate-180]="dropdownOpen()"
            ></i>
          </button>

          <!-- Dropdown Menu -->
          @if (dropdownOpen()) {
            <div
              class="absolute right-0 z-50 mt-2 w-52 overflow-hidden rounded-card border border-border bg-background-secondary p-2 shadow-card-hover"
            >
              <!-- User Information -->
              <div class="border-b border-border px-3 py-3">
                <p class="text-xs text-text-muted">Signed in as</p>

                <p class="mt-1 truncate font-heading text-sm font-bold text-text-primary">
                  {{ provideUser.username() }}
                </p>
              </div>

              <!-- Logout -->
              <button
                type="button"
                (click)="logout()"
                class="mt-2 flex w-full cursor-pointer items-center gap-3 rounded-button px-3 py-2.5 text-left text-sm font-medium text-danger transition-colors duration-200 hover:bg-danger/10"
              >
                <i
                  class="bi bi-box-arrow-right inline-flex h-[18px] w-[18px] shrink-0 items-center justify-center text-[18px] leading-none"
                  aria-hidden="true"
                ></i>

                Sign Out
              </button>
            </div>
          }
        </div>
        <!-- User Avatar -->
      } @else {
        <a
          routerLink="/login"
          type="button"
          class="flex cursor-pointer items-center gap-2 rounded-button bg-primary px-4 py-2.5 text-sm font-bold text-text-inverse transition-all hover:bg-primary-hover hover:shadow-primary"
        >
          <i class="bi bi-person"></i>

          <span class="hidden sm:inline">Login</span>
        </a>
      }
    </div>
  </div>

  <!-- Mobile Navigation -->
  <div class="flex items-center justify-center gap-2 border-t border-border px-4 py-2 md:hidden">
    <a
      routerLink="/notes"
      routerLinkActive="bg-surface-active text-primary"
      #mobileNotesActive="routerLinkActive"
      [class.text-text-secondary]="!mobileNotesActive.isActive"
      ariaCurrentWhenActive="page"
      class="rounded-button px-4 py-2 text-xs font-semibold"
    >
      My Notes
    </a>

    <a
      routerLink="/reminders"
      routerLinkActive="bg-surface-active text-primary"
      #mobileRemindersActive="routerLinkActive"
      [class.text-text-secondary]="!mobileRemindersActive.isActive"
      ariaCurrentWhenActive="page"
      class="rounded-button px-4 py-2 text-xs font-medium"
    >
      Reminders
    </a>

    <a
      routerLink="/categories"
      routerLinkActive="bg-surface-active text-primary"
      #mobileCategoriesActive="routerLinkActive"
      [class.text-text-secondary]="!mobileCategoriesActive.isActive"
      ariaCurrentWhenActive="page"
      class="rounded-button px-4 py-2 text-xs font-medium"
    >
      Categories
    </a>
  </div>
</nav>
